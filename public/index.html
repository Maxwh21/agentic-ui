<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentic-ui</title>
<link rel="icon" href="data:,">
<script>
// Demo mode keeps its own browser storage (chat drafts, open thread), so nothing typed in real mode shows on screen.
if (document.documentElement.dataset.mode === 'demo') try {
  var P = Storage.prototype, g = P.getItem, s = P.setItem, r = P.removeItem;
  var k = function (x) { return x === 'agentic.look' ? x : 'demo:' + x; };
  P.getItem = function (x) { return g.call(this, k(x)); };
  P.setItem = function (x, v) { return s.call(this, k(x), v); };
  P.removeItem = function (x) { return r.call(this, k(x)); };
} catch (e) {}
try { if (localStorage.getItem('agentic.look') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
</script>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/chat.bundle.css">
</head>
<body>
<header id="top">
  <a class="brand" href="#/"><span class="mark"></span>agentic-ui</a>
  <nav>
    <a href="#/" data-nav="home">Home</a>
    <a href="#/activity" data-nav="activity">Activity</a>
    <a href="#/notebooks" data-nav="notebooks">Notebooks</a>
    <a href="#/rules" data-nav="rules">Rules</a>
  </nav>
  <div id="status"></div>
  <button id="mode" title="Switch between real data and demo data (mock services)"></button>
  <button id="theme" title="Switch between light and dark"></button>
</header>
<div id="demo-banner" hidden>Demo mode: outside services are mocks and the data is separate. Nothing real happens.</div>
<main id="page"></main>
<div id="agent"></div>
<div id="toast" hidden></div>
<script src="/vendor/marked.js"></script>
<script src="/vendor/purify.js"></script>
<script src="/chat.bundle.js"></script>
<script src="/app.js"></script>
</body>
</html>
